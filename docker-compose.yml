# SECURITY (checked in CI by scripts/check-compose-security.mjs):
#   * Every published port is bound to 127.0.0.1: nothing here is reachable from another machine. To expose a service, put a
#     reverse proxy with TLS in front of it; do not widen the bind.
#   * No password has a default. Each is `${NAME:?set NAME}`: compose refuses to start without it. Generate a local .env with
#     `scripts/generate-local-env.sh` (random passwords, never committed), or set them in your secret manager for a real deployment.
#     Use URL-safe passwords (hex): REDIS_PASSWORD and ANCHOR_DB_PASSWORD are placed inside URLs.
# Environment every service shares. It holds NO ClickHouse password: each service adds only the one for its own role
# (audit-consumer, metrics-ingester and rollup: the consumer user; audit-api and metrics-report: the api user).
x-app-env: &app-env
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  # An ACL user and password, never anonymous. Use rediss:// (TLS) for a Redis outside this compose network.
  REDIS_URL: redis://${REDIS_USER:-proba}:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379
  CLICKHOUSE_URL: http://clickhouse:8123
  CLICKHOUSE_USER: ${CLICKHOUSE_USER:-proba}
  CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-proba_audit}
  # Append-only users, created by `migrate` (not opt-in). Services refuse to start in production as the admin or migrator user.
  CLICKHOUSE_CONSUMER_USER: ${CLICKHOUSE_CONSUMER_USER:-proba_consumer}
  CLICKHOUSE_API_USER: ${CLICKHOUSE_API_USER:-proba_api}
  CLICKHOUSE_MIGRATOR_USER: ${CLICKHOUSE_MIGRATOR_USER:-proba_migrator}
  EVENT_BUS: ${EVENT_BUS:-redis-streams}
  AUDIT_STORE: ${AUDIT_STORE:-clickhouse}
  # Raw text of events (protocol 0.3.3 `content`): off unless set to true. Same value for audit-consumer and audit-api.
  AUDIT_CONTENT_ENABLED: ${AUDIT_CONTENT_ENABLED:-false}
  AUDIT_CONTENT_STORE: ${AUDIT_CONTENT_STORE:-clickhouse}
  METRICS_STORE: ${METRICS_STORE:-clickhouse}
  CHECKPOINT_STORE: ${CHECKPOINT_STORE:-clickhouse}
  QUARANTINE_STORE: ${QUARANTINE_STORE:-clickhouse}
  # Signed heads of the hash chains (audit-consumer and audit-api): kept in their own Postgres (anchor-db), outside ClickHouse.
  # ANCHOR_HMAC_KEY has no default (>= 32 characters; `openssl rand -hex 32`): audit-consumer and audit-api refuse to start in production without one.
  ANCHOR_STORE: ${ANCHOR_STORE:-postgres}
  ANCHOR_HMAC_KEY: ${ANCHOR_HMAC_KEY:?set ANCHOR_HMAC_KEY}
  ANCHOR_DATABASE_URL: ${ANCHOR_DATABASE_URL:-postgresql://anchors:${ANCHOR_DB_PASSWORD:?set ANCHOR_DB_PASSWORD}@anchor-db:5432/proba_audit_anchors}
  # Leases between replicas (audit-consumer, metrics-ingester, rollup): shared through Redis.
  LEASE_STORE: ${LEASE_STORE:-redis}
  CONSUMER_LEASE_TTL_MS: ${CONSUMER_LEASE_TTL_MS:-30000}
  # Which analytics library serves which ad platform. Empty: the ingester idles.
  # The development data source is meta:stub (see the metrics-e2e profile).
  PLATFORM_CONNECTORS: ${PLATFORM_CONNECTORS:-}
  INGEST_WORKSPACE_ID: ${INGEST_WORKSPACE_ID:-seedbed}
  # Acknowledged audit stream messages older than this are trimmed by the audit-consumer; unacknowledged ones are never removed.
  AUDIT_STREAM_MAX_AGE_HOURS: ${AUDIT_STREAM_MAX_AGE_HOURS:-72}

services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    container_name: proba-audit-clickhouse
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-proba}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:-proba_audit}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "127.0.0.1:${CLICKHOUSE_HTTP_HOST_PORT:-8123}:8123"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: proba-audit-redis
    environment:
      REDIS_USER: ${REDIS_USER:-proba}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    # An ACL user with a password; the `default` user (no password) is switched off. The ACL file is written at start from the
    # environment so the password never appears in the process arguments. The user may do everything except the @dangerous
    # commands (FLUSHALL, FLUSHDB, KEYS, CONFIG, DEBUG, SHUTDOWN, ...), which the audit services never need.
    # AOF persistence ON: the audit stream must survive a Redis restart.
    command:
      - sh
      - -c
      - >-
        umask 077 &&
        printf 'user default off\nuser %s on >%s ~* &* +@all -@dangerous\n' "$$REDIS_USER" "$$REDIS_PASSWORD" > /tmp/users.acl &&
        exec redis-server --aclfile /tmp/users.acl --appendonly yes --appendfsync everysec
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli --user "$$REDIS_USER" ping | grep -q PONG']
      interval: 10s
      timeout: 3s
      retries: 5

  # Postgres is NOT part of the audit stack. It exists only to run the
  # PostgresOutboxStore integration tests:
  #   docker compose --profile test up -d postgres
  postgres:
    profiles: ["test"]
    image: postgres:16-alpine
    container_name: proba-audit-postgres-test
    environment:
      POSTGRES_USER: proba
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: proba_audit_outbox_test
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proba -d proba_audit_outbox_test"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: create the database and apply ClickHouse migrations.
  # docker compose --profile apps run --rm migrate
  migrate:
    profiles: ["apps", "metrics-e2e"]
    build:
      context: .
      target: migrate
    depends_on:
      clickhouse:
        condition: service_healthy
    # The admin (CLICKHOUSE_USER) is the only one allowed to create users: only this one-shot gets its password, and the three
    # role passwords, to create the users (consumer: INSERT+SELECT, api: SELECT, migrator: DDL) and apply the migrations.
    environment:
      <<: *app-env
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD}
      CLICKHOUSE_CONSUMER_PASSWORD: ${CLICKHOUSE_CONSUMER_PASSWORD:?set CLICKHOUSE_CONSUMER_PASSWORD}
      CLICKHOUSE_API_PASSWORD: ${CLICKHOUSE_API_PASSWORD:?set CLICKHOUSE_API_PASSWORD}
      CLICKHOUSE_MIGRATOR_PASSWORD: ${CLICKHOUSE_MIGRATOR_PASSWORD:?set CLICKHOUSE_MIGRATOR_PASSWORD}

  # The anchor store: NOT the ClickHouse that holds the audit events, and with its own credentials, so that whoever can delete
  # audit events cannot also rewrite the signed chain heads. For anything real, use a managed Postgres and set ANCHOR_DATABASE_URL.
  anchor-db:
    profiles: ["apps"]
    image: postgres:16-alpine
    container_name: proba-audit-anchor-db
    environment:
      POSTGRES_USER: anchors
      POSTGRES_PASSWORD: ${ANCHOR_DB_PASSWORD:?set ANCHOR_DB_PASSWORD}
      POSTGRES_DB: proba_audit_anchors
    volumes:
      - anchor_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anchors -d proba_audit_anchors"]
      interval: 5s
      timeout: 3s
      retries: 10

  audit-consumer:
    profiles: ["apps"]
    build:
      context: .
      target: audit-consumer
    container_name: proba-audit-consumer
    depends_on: &app-deps
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      anchor-db:
        condition: service_healthy
    environment:
      <<: *app-env
      CLICKHOUSE_CONSUMER_PASSWORD: ${CLICKHOUSE_CONSUMER_PASSWORD:?set CLICKHOUSE_CONSUMER_PASSWORD}
      PORT: 3101
    ports:
      - "127.0.0.1:${AUDIT_CONSUMER_HOST_PORT:-3101}:3101"
    restart: unless-stopped

  audit-api:
    profiles: ["apps"]
    build:
      context: .
      target: audit-api
    container_name: proba-audit-api
    depends_on: *app-deps
    environment:
      <<: *app-env
      CLICKHOUSE_API_PASSWORD: ${CLICKHOUSE_API_PASSWORD:?set CLICKHOUSE_API_PASSWORD}
      PORT: 3100
      # Sign-in: Firebase ID tokens of this project, verified with Google's public keys (no secret).
      AUDIT_API_TOKEN_VERIFIER: ${AUDIT_API_TOKEN_VERIFIER:-firebase}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      # Who may use the API (verified emails). Empty lists allow nobody.
      AUDIT_API_ALLOWED_EMAILS: ${AUDIT_API_ALLOWED_EMAILS:-}
      AUDIT_API_ALLOWED_EMAIL_DOMAINS: ${AUDIT_API_ALLOWED_EMAIL_DOMAINS:-}
      AUDIT_API_ADMIN_EMAILS: ${AUDIT_API_ADMIN_EMAILS:-}
      AUDIT_API_WORKSPACE_ID: ${AUDIT_API_WORKSPACE_ID:-seedbed}
      # Exact origin(s) of the insights portal.
      AUDIT_API_CORS_ORIGINS: ${AUDIT_API_CORS_ORIGINS:-}
      # Rate limits are shared between replicas through Redis.
      AUDIT_API_RATE_LIMITER: ${AUDIT_API_RATE_LIMITER:-redis}
      AUDIT_API_SCOPE_SOURCE: ${AUDIT_API_SCOPE_SOURCE:-connectors}
      AUDIT_API_ANALYTICS_ACCOUNTS: ${AUDIT_API_ANALYTICS_ACCOUNTS:-}
      AUDIT_API_TRUST_PROXY: ${AUDIT_API_TRUST_PROXY:-false}
      # Service role for the context bridge (docs/CONTEXT_READER.md). The key files are paths inside the container: mount them read-only.
      AUDIT_API_CONTEXT_READER_ENABLED: ${AUDIT_API_CONTEXT_READER_ENABLED:-false}
      CONTEXT_SERVICE_PUBLIC_KEY_FILE: ${CONTEXT_SERVICE_PUBLIC_KEY_FILE:-}
      HUB_ASSERTION_PUBLIC_KEY_FILE: ${HUB_ASSERTION_PUBLIC_KEY_FILE:-}
    ports:
      - "127.0.0.1:${AUDIT_API_HOST_PORT:-3100}:3100"
    restart: unless-stopped

  metrics-ingester:
    profiles: ["apps"]
    build:
      context: .
      target: metrics-ingester
    container_name: proba-metrics-ingester
    depends_on: *app-deps
    environment:
      <<: *app-env
      CLICKHOUSE_CONSUMER_PASSWORD: ${CLICKHOUSE_CONSUMER_PASSWORD:?set CLICKHOUSE_CONSUMER_PASSWORD}
      PORT: 3102
    ports:
      - "127.0.0.1:${METRICS_INGESTER_HOST_PORT:-3102}:3102"
    restart: unless-stopped

  rollup:
    profiles: ["apps"]
    build:
      context: .
      target: rollup
    container_name: proba-rollup
    depends_on: *app-deps
    environment:
      <<: *app-env
      CLICKHOUSE_CONSUMER_PASSWORD: ${CLICKHOUSE_CONSUMER_PASSWORD:?set CLICKHOUSE_CONSUMER_PASSWORD}
      PORT: 3103
    ports:
      - "127.0.0.1:${ROLLUP_HOST_PORT:-3103}:3103"
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # End to end on the development data source (no real ad platform involved):
  #   docker compose --profile metrics-e2e up -d --build e2e-ingester e2e-rollup e2e-audit-consumer
  #   docker compose --profile metrics-e2e run --rm metrics-report     # waits up to 90 s for data
  #   docker compose --profile metrics-e2e down
  # The ingester pulls from the stub connector every few seconds (the stub restates recent
  # hours every minute), the rollup worker follows, the audit consumer stores the audit trail,
  # and metrics-report prints what the read side returns. NODE_ENV=development and
  # ALLOW_STUB_CONNECTOR are set here ONLY: the apps profile above runs production-like and
  # refuses the stub.
  # ---------------------------------------------------------------------------
  e2e-ingester:
    profiles: ["metrics-e2e"]
    build:
      context: .
      target: metrics-ingester
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment: &e2e-env
      <<: *app-env
      CLICKHOUSE_CONSUMER_PASSWORD: ${CLICKHOUSE_CONSUMER_PASSWORD:?set CLICKHOUSE_CONSUMER_PASSWORD}
      CLICKHOUSE_API_PASSWORD: ${CLICKHOUSE_API_PASSWORD:?set CLICKHOUSE_API_PASSWORD}
      NODE_ENV: development
      # Development run: anchors in memory with the development key (no anchor-db in this profile).
      ANCHOR_STORE: memory
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PLATFORM_CONNECTORS: meta:stub,google:stub
      ALLOW_STUB_CONNECTOR: "true"
      INGEST_INTERVAL_MS: ${E2E_INGEST_INTERVAL_MS:-5000}
      INGEST_INITIAL_LOOKBACK_HOURS: 72
      # The stub revises every period of the last 2 hours once a minute, so a short run shows restatements.
      STUB_RESTATE_EVERY_MINUTES: 1
      STUB_RESTATE_REVISIONS: 120
      PORT: 3102

  e2e-rollup:
    profiles: ["metrics-e2e"]
    build:
      context: .
      target: rollup
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      <<: *e2e-env
      ROLLUP_INTERVAL_MS: ${E2E_ROLLUP_INTERVAL_MS:-3000}
      PORT: 3103

  e2e-audit-consumer:
    profiles: ["metrics-e2e"]
    build:
      context: .
      target: audit-consumer
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      <<: *e2e-env
      PORT: 3101

  metrics-report:
    profiles: ["metrics-e2e"]
    build:
      context: .
      target: metrics-report
    depends_on:
      - e2e-ingester
      - e2e-rollup
      - e2e-audit-consumer
    environment:
      <<: *e2e-env
      PORT: 0

volumes:
  clickhouse_data:
  redis_data:
  anchor_data:
