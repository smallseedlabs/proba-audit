openapi: 3.1.0
info:
  title: Proba Audit API
  version: 1.0.0
  summary: Read-only access to the audit trail, traces, chain integrity and campaign analytics of one workspace.
  description: |
    Every route is read-only (GET) and requires `Authorization: Bearer <Firebase ID token>`, the same
    token the Proba Hub accepts. Tokens are never accepted in the URL.

    The workspace is decided by the server from the authenticated session. There is no workspace
    parameter, and unknown query parameters are rejected with `400`.

    Every response carries `X-Trace-Id` (also in error bodies). Every authenticated read is itself
    recorded in the audit trail (`data_access.*`).

    This file is kept in sync with the code by `apps/audit-api/src/openapi.test.ts`.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: http://localhost:3100
    description: Local
tags:
  - name: Audit
  - name: Integrity
  - name: Analytics
  - name: Operations
security:
  - firebaseIdToken: []
paths:
  /health:
    get:
      tags: [Operations]
      operationId: getHealth
      summary: Liveness
      security: []
      responses:
        '200':
          description: The process is up.
          content:
            application/json:
              schema:
                type: object
                required: [status, service]
                properties:
                  status: { type: string, const: ok }
                  service: { type: string }
  /ready:
    get:
      tags: [Operations]
      operationId: getReady
      summary: Readiness (dependencies reachable)
      security: []
      responses:
        '200':
          description: Ready.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Readiness' }
        '503':
          description: A dependency is unavailable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Readiness' }
  /v1/session:
    get:
      tags: [Audit]
      operationId: getSession
      summary: The caller's own identity and role
      responses:
        '200':
          description: The authenticated session.
          headers: { X-Trace-Id: { $ref: '#/components/headers/XTraceId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/events:
    get:
      tags: [Audit]
      operationId: searchEvents
      summary: Search audit events
      description: |
        Sorted by `occurredAt` then `eventId`. Filters combine with AND. Without `from`/`to` the last
        24 hours are searched (unless anchored on `traceId`, `goalId` or `threadId`). Ranges are at most 90 days.
      parameters:
        - { $ref: '#/components/parameters/from' }
        - { $ref: '#/components/parameters/to' }
        - name: traceId
          in: query
          schema: { type: string, format: uuid }
        - name: actor
          in: query
          description: Id of the actor (a user, service or the brain).
          schema: { type: string, minLength: 1, maxLength: 128 }
        - name: actorType
          in: query
          schema: { $ref: '#/components/schemas/ActorType' }
        - name: service
          in: query
          schema: { type: string, minLength: 1, maxLength: 64 }
        - name: action
          in: query
          schema: { type: string, minLength: 1, maxLength: 128, pattern: '^[a-z0-9_.-]+$' }
        - name: category
          in: query
          schema: { $ref: '#/components/schemas/Category' }
        - name: outcome
          in: query
          schema: { $ref: '#/components/schemas/Outcome' }
        - name: riskLevel
          in: query
          schema: { $ref: '#/components/schemas/RiskLevel' }
        - name: goalId
          in: query
          schema: { type: string, format: uuid }
        - name: threadId
          in: query
          schema: { type: string, format: uuid }
        - name: campaignId
          in: query
          schema: { $ref: '#/components/schemas/CampaignId' }
        - name: q
          in: query
          description: Case-insensitive text matched literally against action and target.
          schema: { type: string, minLength: 2, maxLength: 100 }
        - name: order
          in: query
          schema: { type: string, enum: [asc, desc], default: desc }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - { $ref: '#/components/parameters/cursor' }
      responses:
        '200':
          description: One page of events.
          headers: { X-Trace-Id: { $ref: '#/components/headers/XTraceId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventsPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/events/{eventId}:
    get:
      tags: [Audit]
      operationId: getEvent
      summary: One audit event, with its chain fields
      parameters:
        - name: eventId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The event.
          headers: { X-Trace-Id: { $ref: '#/components/headers/XTraceId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StoredAuditEvent' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/traces:
    get:
      tags: [Audit]
      operationId: listTraces
      summary: Recent traces with summaries
      description: Newest activity first. Ranges are at most 7 days; the default is the last 24 hours.
      parameters:
        - { $ref: '#/components/parameters/from' }
        - { $ref: '#/components/parameters/to' }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - { $ref: '#/components/parameters/cursor' }
      responses:
        '200':
          description: One page of trace summaries.
          headers: { X-Trace-Id: { $ref: '#/components/headers/XTraceId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TracesPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/traces/{traceId}:
    get:
      tags: [Audit]
      operationId: getTrace
      summary: A trace as a span tree
      description: Up to 1000 events are loaded; a longer trace is cut and marked `truncated`.
      parameters:
        - name: traceId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The span tree with durations and the outcome rolled up.
          headers: { X-Trace-Id: { $ref: '#/components/headers/XTraceId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TraceTree' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/chain/verify:
    get:
      tags: [Integrity]
      operationId: verifyChain
      summary: Verify the hash chain of the caller's workspace over an ingestion range
      description: |
        Administrators only. The range is on ingestion time, at most 24 hours and at most 100000 events
        (configurable); when the event bound stops verification `truncated` is true. Rate limited
        separately from other routes.
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: 'The verification result. A broken chain is a normal answer with `ok: false`.'
          headers: { X-Trace-Id: { $ref: '#/components/headers/XTraceId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChainVerification' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/analytics/summary:
    get:
      tags: [Analytics]
      operationId: getAnalyticsSummary
      summary: Totals and a time series of impressions, clicks, spend and conversions
      description: 'Hourly ranges must start and end on the hour and are at most 14 days; daily ranges must start and end at UTC midnight and are at most 366 days. Amounts of different currencies are never added.'
      parameters:
        - { $ref: '#/components/parameters/requiredFrom' }
        - { $ref: '#/components/parameters/requiredTo' }
        - { $ref: '#/components/parameters/granularity' }
        - name: campaignId
          in: query
          schema: { $ref: '#/components/schemas/CampaignId' }
      responses:
        '200':
          description: The summary and the freshness of the data.
          headers: { X-Trace-Id: { $ref: '#/components/headers/XTraceId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MetricsSummary' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/analytics/compare:
    get:
      tags: [Analytics]
      operationId: compareAnalyticsPeriods
      summary: Compare two periods
      description: 'Without `previousFrom`/`previousTo` the period of the same length right before the current one is used. Bounds follow the same alignment rules as the summary (on the hour, or at UTC midnight for daily).'
      parameters:
        - { $ref: '#/components/parameters/granularity' }
        - name: currentFrom
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: currentTo
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: previousFrom
          in: query
          schema: { type: string, format: date-time }
        - name: previousTo
          in: query
          schema: { type: string, format: date-time }
        - name: campaignId
          in: query
          schema: { $ref: '#/components/schemas/CampaignId' }
      responses:
        '200':
          description: The totals of both periods and the change per currency.
          headers: { X-Trace-Id: { $ref: '#/components/headers/XTraceId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PeriodComparison' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/analytics/campaigns:
    get:
      tags: [Analytics]
      operationId: getTopCampaigns
      summary: Top campaigns by spend
      parameters:
        - { $ref: '#/components/parameters/requiredFrom' }
        - { $ref: '#/components/parameters/requiredTo' }
        - { $ref: '#/components/parameters/granularity' }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Campaign rows, highest spend first.
          headers: { X-Trace-Id: { $ref: '#/components/headers/XTraceId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CampaignsResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/facets:
    get:
      tags: [Audit]
      operationId: getFacets
      summary: Distinct values per filter, with counts
      description: Capped per facet; a facet with more values than returned is listed in `truncated`. The default range is the last 7 days.
      parameters:
        - { $ref: '#/components/parameters/from' }
        - { $ref: '#/components/parameters/to' }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: The facets.
          headers: { X-Trace-Id: { $ref: '#/components/headers/XTraceId' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Facets' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
components:
  securitySchemes:
    firebaseIdToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: A Firebase ID token for the Proba project. The caller's verified email must be on the configured allow-list.
  parameters:
    from:
      name: from
      in: query
      description: Start of the range (inclusive), ISO 8601 UTC.
      schema: { type: string, format: date-time }
    to:
      name: to
      in: query
      description: End of the range (exclusive), ISO 8601 UTC.
      schema: { type: string, format: date-time }
    requiredFrom:
      name: from
      in: query
      required: true
      schema: { type: string, format: date-time }
    requiredTo:
      name: to
      in: query
      required: true
      schema: { type: string, format: date-time }
    granularity:
      name: granularity
      in: query
      schema: { type: string, enum: [hour, day], default: day }
    cursor:
      name: cursor
      in: query
      description: The `nextCursor` of the previous page. Opaque.
      schema: { type: string, minLength: 1, maxLength: 512 }
  headers:
    XTraceId:
      description: Trace id of this request (also on every error, and in the audit trail).
      schema: { type: string, format: uuid }
  responses:
    BadRequest:
      description: A parameter is missing, unknown or out of bounds. `issues` names each one.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: No token, or a token that is not valid.
      headers:
        WWW-Authenticate:
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: The caller is authenticated but not allowed (not on the allow-list, or not an administrator).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: No such record in the caller's workspace.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: Too many requests.
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      required: [error, message, traceId]
      properties:
        error: { type: string, description: A stable machine-readable code. }
        message: { type: string }
        traceId: { type: string, format: uuid }
        issues:
          type: array
          items:
            type: object
            required: [path, message]
            properties:
              path: { type: string }
              message: { type: string }
    Readiness:
      type: object
      required: [status, checks]
      properties:
        status: { type: string, enum: [ready, not_ready] }
        checks:
          type: object
          additionalProperties: { type: string, enum: [ok, unavailable] }
    Session:
      type: object
      required: [subject, email, role, workspaceId]
      properties:
        subject: { type: string }
        email: { type: string }
        role: { type: string, enum: [viewer, admin] }
        workspaceId: { type: string }
    ActorType: { type: string, enum: [user, brain, system, service] }
    Category:
      type: string
      enum: [command, brain, tool, policy, approval, data_access, memory, metrics, auth, config, system]
    Outcome: { type: string, enum: [success, failure, denied, partial] }
    RiskLevel: { type: string, enum: [low, medium, high] }
    CampaignId: { type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9_.:-]+$' }
    StoredAuditEvent:
      type: object
      additionalProperties: false
      required: [version, eventId, traceId, spanId, workspaceId, actor, service, action, category, outcome, occurredAt, details, prevHash, hash, ingestedAt, schemaVersion]
      properties:
        version: { type: number, const: 1 }
        eventId: { type: string, format: uuid }
        traceId: { type: string, format: uuid }
        spanId: { type: string, pattern: '^[0-9a-f]{16}$' }
        parentSpanId: { type: string, pattern: '^[0-9a-f]{16}$' }
        workspaceId: { type: string, minLength: 1 }
        userId: { type: string, format: uuid }
        goalId: { type: string, format: uuid }
        threadId: { type: string, format: uuid }
        campaignId: { type: string, minLength: 1 }
        actor:
          type: object
          additionalProperties: false
          required: [type, id]
          properties:
            type: { $ref: '#/components/schemas/ActorType' }
            id: { type: string, minLength: 1 }
        service: { type: string, minLength: 1 }
        action: { type: string }
        category: { $ref: '#/components/schemas/Category' }
        target: { $ref: '#/components/schemas/Target' }
        outcome: { $ref: '#/components/schemas/Outcome' }
        errorCode: { type: string, minLength: 1 }
        errorMessage: { type: string }
        riskLevel: { $ref: '#/components/schemas/RiskLevel' }
        cost:
          type: object
          additionalProperties: false
          properties:
            tokensIn: { type: integer, minimum: 0 }
            tokensOut: { type: integer, minimum: 0 }
            currency: { type: string, minLength: 3, maxLength: 3 }
            amount: { type: number, minimum: 0 }
        durationMs: { type: number, minimum: 0 }
        occurredAt: { type: string, format: date-time }
        details: { type: object, additionalProperties: true }
        tags:
          type: array
          items: { type: string, minLength: 1 }
        prevHash: { type: [string, 'null'], pattern: '^[0-9a-f]{64}$' }
        hash: { type: [string, 'null'], pattern: '^[0-9a-f]{64}$' }
        ingestedAt: { type: string, format: date-time }
        schemaVersion: { type: integer, minimum: 1 }
    Target:
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type: { type: string, minLength: 1 }
        id: { type: string, minLength: 1 }
    EventsPage:
      type: object
      required: [events, nextCursor, from, to, order, limit]
      properties:
        events:
          type: array
          items: { $ref: '#/components/schemas/StoredAuditEvent' }
        nextCursor: { type: [string, 'null'], description: Null on the last page. }
        from: { type: [string, 'null'], format: date-time }
        to: { type: [string, 'null'], format: date-time }
        order: { type: string, enum: [asc, desc] }
        limit: { type: integer }
    TraceSummary:
      type: object
      required: [traceId, rootAction, rootService, startedAt, lastEventAt, eventCount, outcome, durationMs]
      properties:
        traceId: { type: string, format: uuid }
        rootAction: { type: string }
        rootService: { type: string }
        startedAt: { type: string, format: date-time }
        lastEventAt: { type: string, format: date-time }
        eventCount: { type: integer }
        outcome: { $ref: '#/components/schemas/Outcome' }
        riskLevel: { $ref: '#/components/schemas/RiskLevel' }
        durationMs: { type: number }
    TracesPage:
      type: object
      required: [traces, nextCursor, from, to, limit]
      properties:
        traces:
          type: array
          items: { $ref: '#/components/schemas/TraceSummary' }
        nextCursor: { type: [string, 'null'] }
        from: { type: [string, 'null'], format: date-time }
        to: { type: [string, 'null'], format: date-time }
        limit: { type: integer }
    SpanNode:
      type: object
      required: [eventId, spanId, action, service, category, outcome, actor, startedAt, offsetMs, durationMs, subtreeOutcome, children]
      properties:
        eventId: { type: string, format: uuid }
        spanId: { type: string }
        parentSpanId: { type: string }
        action: { type: string }
        service: { type: string }
        category: { $ref: '#/components/schemas/Category' }
        outcome: { $ref: '#/components/schemas/Outcome' }
        riskLevel: { $ref: '#/components/schemas/RiskLevel' }
        actor:
          type: object
          required: [type, id]
          properties:
            type: { $ref: '#/components/schemas/ActorType' }
            id: { type: string }
        target: { $ref: '#/components/schemas/Target' }
        errorCode: { type: string }
        goalId: { type: string, format: uuid }
        threadId: { type: string, format: uuid }
        campaignId: { type: string }
        startedAt: { type: string, format: date-time, description: occurredAt, the moment the step started. }
        offsetMs: { type: number, description: Milliseconds from the start of the trace. }
        durationMs: { type: [number, 'null'], description: The step's own duration when reported. }
        subtreeOutcome: { $ref: '#/components/schemas/Outcome' }
        orphan: { type: boolean, description: Its parent span is not in the trace. }
        children:
          type: array
          items: { $ref: '#/components/schemas/SpanNode' }
    TraceTree:
      type: object
      required: [traceId, startedAt, endedAt, durationMs, eventCount, outcome, truncated, roots, related]
      properties:
        traceId: { type: string, format: uuid }
        startedAt: { type: string, format: date-time }
        endedAt: { type: string, format: date-time }
        durationMs: { type: number }
        eventCount: { type: integer }
        outcome: { $ref: '#/components/schemas/Outcome' }
        riskLevel: { $ref: '#/components/schemas/RiskLevel' }
        truncated: { type: boolean }
        roots:
          type: array
          items: { $ref: '#/components/schemas/SpanNode' }
        related:
          type: object
          required: [goalIds, threadIds, campaignIds]
          properties:
            goalIds: { type: array, items: { type: string } }
            threadIds: { type: array, items: { type: string } }
            campaignIds: { type: array, items: { type: string } }
    ChainVerification:
      type: object
      required: [workspaceId, range, ok, checked, firstEventId, lastEventId, lastHash, problems, complete]
      properties:
        workspaceId: { type: string }
        range:
          type: object
          properties:
            from: { type: string, format: date-time }
            to: { type: string, format: date-time }
        ok: { type: boolean }
        checked: { type: integer }
        firstEventId: { type: [string, 'null'] }
        lastEventId: { type: [string, 'null'] }
        lastHash: { type: [string, 'null'] }
        problems:
          type: array
          items:
            type: object
            required: [type, eventId, detail]
            properties:
              type:
                type: string
                enum: [invalid_event, workspace_mismatch, hash_mismatch, broken_link, bad_genesis, non_monotonic_ingested_at]
              eventId: { type: string }
              detail: { type: string }
        complete: { type: boolean }
        truncated: { type: boolean, description: Present (true) when the event bound stopped verification early. }
    Freshness:
      type: object
      required: [asOf, rollupsComputedAt, observationsFetchedAt]
      properties:
        asOf:
          type: [string, 'null']
          format: date-time
          description: The moment the figures are current to; null when there is no data yet.
        rollupsComputedAt: { type: [string, 'null'], format: date-time }
        observationsFetchedAt: { type: [string, 'null'], format: date-time }
    MetricsTotals:
      type: object
      required: [currency, impressions, clicks, spend, conversions, ctr, cpc, cpm, cpa, roas, observationCount]
      properties:
        currency: { type: string }
        impressions: { type: number }
        clicks: { type: number }
        spend: { type: number }
        conversions: { type: number }
        videoViews: { type: number }
        revenue: { type: number }
        ctr: { type: [number, 'null'] }
        cpc: { type: [number, 'null'] }
        cpm: { type: [number, 'null'] }
        cpa: { type: [number, 'null'] }
        roas: { type: [number, 'null'] }
        observationCount: { type: integer }
    SeriesPoint:
      allOf:
        - { $ref: '#/components/schemas/MetricsTotals' }
        - type: object
          required: [bucket]
          properties:
            bucket: { type: string, description: 'UTC instant of the hour (hour) or the calendar date YYYY-MM-DD (day).' }
    CampaignTotals:
      allOf:
        - { $ref: '#/components/schemas/MetricsTotals' }
        - type: object
          required: [platform, accountId, campaignId]
          properties:
            platform: { type: string }
            accountId: { type: string }
            campaignId: { type: string }
    MetricsSummary:
      type: object
      required: [workspaceId, from, to, granularity, totals, series, freshness]
      properties:
        workspaceId: { type: string }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        granularity: { type: string, enum: [hour, day] }
        campaignId: { type: string }
        totals:
          type: array
          description: One entry per currency.
          items: { $ref: '#/components/schemas/MetricsTotals' }
        series:
          type: array
          items: { $ref: '#/components/schemas/SeriesPoint' }
        campaigns:
          type: array
          items: { $ref: '#/components/schemas/CampaignTotals' }
        campaignsTruncated: { type: boolean }
        freshness: { $ref: '#/components/schemas/Freshness' }
    Change:
      type: object
      required: [current, previous, change, changePct]
      properties:
        current: { type: number }
        previous: { type: number }
        change: { type: number }
        changePct: { type: [number, 'null'], description: Percent; null when the previous value is 0. }
    Period:
      type: object
      required: [from, to, totals]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        totals:
          type: array
          items: { $ref: '#/components/schemas/MetricsTotals' }
    PeriodComparison:
      type: object
      required: [workspaceId, granularity, current, previous, comparison, freshness]
      properties:
        workspaceId: { type: string }
        granularity: { type: string, enum: [hour, day] }
        campaignId: { type: string }
        current: { $ref: '#/components/schemas/Period' }
        previous: { $ref: '#/components/schemas/Period' }
        comparison:
          type: array
          items:
            type: object
            required: [currency, impressions, clicks, spend, conversions]
            properties:
              currency: { type: string }
              impressions: { $ref: '#/components/schemas/Change' }
              clicks: { $ref: '#/components/schemas/Change' }
              spend: { $ref: '#/components/schemas/Change' }
              conversions: { $ref: '#/components/schemas/Change' }
        freshness: { $ref: '#/components/schemas/Freshness' }
    CampaignsResponse:
      type: object
      required: [workspaceId, from, to, granularity, campaigns, truncated, freshness]
      properties:
        workspaceId: { type: string }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        granularity: { type: string, enum: [hour, day] }
        campaigns:
          type: array
          items: { $ref: '#/components/schemas/CampaignTotals' }
        truncated: { type: boolean }
        freshness: { $ref: '#/components/schemas/Freshness' }
    FacetValue:
      type: object
      required: [value, count]
      properties:
        value: { type: string }
        count: { type: integer }
    Facets:
      type: object
      required: [facets, truncated, from, to, limit]
      properties:
        facets:
          type: object
          required: [service, action, category, outcome, riskLevel, actorType, actorId, campaignId]
          additionalProperties: false
          properties:
            service: { $ref: '#/components/schemas/FacetValues' }
            action: { $ref: '#/components/schemas/FacetValues' }
            category: { $ref: '#/components/schemas/FacetValues' }
            outcome: { $ref: '#/components/schemas/FacetValues' }
            riskLevel: { $ref: '#/components/schemas/FacetValues' }
            actorType: { $ref: '#/components/schemas/FacetValues' }
            actorId: { $ref: '#/components/schemas/FacetValues' }
            campaignId: { $ref: '#/components/schemas/FacetValues' }
        truncated:
          type: array
          items: { type: string }
        from: { type: [string, 'null'], format: date-time }
        to: { type: [string, 'null'], format: date-time }
        limit: { type: integer }
    FacetValues:
      type: array
      items: { $ref: '#/components/schemas/FacetValue' }
