name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript compiler (sources and tests)
        run: npm run typecheck

      - name: Build all workspaces
        run: npm run build

  compose-security:
    name: Compose security (loopback ports, no default passwords)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Resolves docker-compose.yml for every profile and fails if a published port is not bound to 127.0.0.1,
      # a password has a default (or a literal), or a required password variable is not really required.
      - name: Check docker-compose.yml
        run: node scripts/check-compose-security.mjs

  test:
    name: Unit Tests (in-memory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests (fails on any skipped/todo test)
        run: npm run test:ci

  integration-test:
    name: Integration Tests (ClickHouse + Redis + Postgres)
    runs-on: ubuntu-latest
    # The services come from docker-compose.yml itself (authenticated Redis with an ACL user, passworded ClickHouse and Postgres,
    # ports on 127.0.0.1), so the tests run against the same configuration as the local and production stacks.
    env:
      NODE_ENV: test
      LOG_LEVEL: warn

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Throwaway passwords, generated for this run only (masked in the log).
      - name: Generate throwaway credentials
        run: |
          set -euo pipefail
          for name in CLICKHOUSE_PASSWORD REDIS_PASSWORD POSTGRES_PASSWORD ANCHOR_DB_PASSWORD ANCHOR_HMAC_KEY; do
            value="$(openssl rand -hex 24)"
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done

      - name: Start ClickHouse, Redis and Postgres (docker compose)
        run: docker compose --profile test up -d --wait clickhouse redis postgres

      # The ClickHouse image restarts its server once after creating the user, and /ping can answer during that window.
      # Wait for an authenticated query to succeed several times in a row before migrating.
      - name: Wait for ClickHouse to accept the configured user
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 60); do
            if curl -fsS --max-time 3 --user "proba:${CLICKHOUSE_PASSWORD}" "http://127.0.0.1:8123/?query=SELECT%201" >/dev/null 2>&1; then
              ok=$((ok + 1))
              [ "$ok" -ge 3 ] && exit 0
            else
              ok=0
            fi
            sleep 1
          done
          echo "ClickHouse did not become ready" >&2
          exit 1

      - name: Point the tests at them
        run: |
          set -euo pipefail
          {
            echo "REDIS_URL=redis://proba:${REDIS_PASSWORD}@127.0.0.1:6379"
            echo "CLICKHOUSE_URL=http://127.0.0.1:8123"
            echo "CLICKHOUSE_USER=proba"
            echo "CLICKHOUSE_DATABASE=proba_audit"
            echo "OUTBOX_TEST_DATABASE_URL=postgresql://proba:${POSTGRES_PASSWORD}@127.0.0.1:5432/proba_audit_outbox_test"
          } >> "$GITHUB_ENV"

      # Also creates the append-only users (consumer INSERT+SELECT, api SELECT, migrator DDL) from three role passwords.
      # The role passwords are generated here and only given to this step: the test step must not see a role password without a
      # role user (the config rejects that), and the integration test provisions its own users.
      - name: Run migrations (builds first)
        run: |
          set -euo pipefail
          for name in CLICKHOUSE_CONSUMER_PASSWORD CLICKHOUSE_API_PASSWORD CLICKHOUSE_MIGRATOR_PASSWORD; do
            value="$(openssl rand -hex 24)"
            echo "::add-mask::$value"
            export "$name=$value"
          done
          npm run migrate
        env:
          CLICKHOUSE_CONSUMER_USER: proba_consumer
          CLICKHOUSE_API_USER: proba_api
          CLICKHOUSE_MIGRATOR_USER: proba_migrator

      # Runs the adapter contract suites (Redis Streams event bus, ClickHouse audit,
      # metrics, checkpoint and quarantine stores, Postgres outbox), the migration tests,
      # the default-adapter wiring test, the audit-consumer end-to-end tests and the
      # metrics flow tests (stub -> ingest -> rollup -> read on ClickHouse and Redis).
      - name: Run integration tests (0 skipped)
        run: npm run test:integration:ci

      - name: Stop the services
        if: always()
        run: docker compose --profile test down -v

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-report
          path: test-reports/
          if-no-files-found: ignore

  docker:
    name: Docker Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [audit-consumer, audit-api, metrics-ingester, metrics-report, rollup, migrate]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: ${{ matrix.target }}
          push: false
          tags: proba-audit-${{ matrix.target }}:test
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
